general {
	# Use hyprlock for our lock command. Avoids starting multiple locker instances
	lock_cmd = pidof hyprlock || hyprlock
	# Lock before the system goes to sleep. Resuming from suspension will have the lock screen open
	before_sleep_cmd = loginctl lock-session
}

# Stage 1: Dim the screen
listener {
	timeout    = 150    # 2 min 30 sec
	on-timeout = brightnessctl --save set 10%
	on-resume  = brightnessctl --restore
}

# Stage 2: Lock the screen
listener {
	timeout = 300    # 5 mins
	on-timeout = loginctl lock-session
}

# Stage 3: Turn off screen signal
listener {
	timeout = 1200    # 20 mins
	on-timeout = systemctl suspend
}
